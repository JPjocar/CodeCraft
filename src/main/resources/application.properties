spring.application.name=CodeCraft

# ---------------------------------------------------------------------------
# Base de datos
# La contrasena NO se versiona. Define DB_PASSWORD en el entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codecraftdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración de Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# OJO: 'create' borra y recrea el esquema en cada arranque. Vale para desarrollo;
# antes de produccion hay que migrar a Flyway/Liquibase y poner 'validate'.
spring.jpa.hibernate.ddl-auto=create

# Opcional: Mostrar las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# JWT
# JWT_SECRET es obligatorio y debe tener 32+ caracteres (ver JwtUtils).
# La clave anterior estuvo versionada en texto plano: se considera comprometida.
# ---------------------------------------------------------------------------
spring.jwt.private.key=${JWT_SECRET}
spring.jwt.private.user=${JWT_ISSUER:AUTH-COSMOS}

# ---------------------------------------------------------------------------
# Almacenamiento de imagenes
# Ruta relativa por defecto para que el proyecto arranque en cualquier maquina.
# ---------------------------------------------------------------------------
spring.directory.uploads=${UPLOADS_DIR:./uploads}
codecraft.uploads.public-url=${UPLOADS_PUBLIC_URL:http://localhost:8080/uploads}

# CORS: origen del frontend Angular
codecraft.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}

spring.sql.init.mode=always

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
