spring.application.name=CodeCraft

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codecraftdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración de Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create

# Opcional: Mostrar las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jwt.private.key=${JWT_SECRET}
spring.jwt.private.user=${JWT_ISSUER:AUTH-COSMOS}

spring.directory.uploads=${UPLOADS_DIR:./uploads}
codecraft.uploads.public-url=${UPLOADS_PUBLIC_URL:http://localhost:8080/uploads}

codecraft.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}

spring.sql.init.mode=always

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
