spring.application.name=CodeCraft

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codecraftdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jwt.private.key=test-only-secret-key-not-used-in-production-0123456789
spring.jwt.private.user=AUTH-COSMOS

spring.directory.uploads=./target/test-uploads
codecraft.uploads.public-url=http://localhost:8080/uploads

codecraft.cors.allowed-origins=http://localhost:4200

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
